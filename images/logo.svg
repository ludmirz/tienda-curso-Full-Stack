<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Sombra suave para dar relieve -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
    
    <!-- Gradiente de fondo del disco -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8f9fa" />
    </linearGradient>

    <!-- Gradiente dorado para detalles -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffc107" />
      <stop offset="100%" stop-color="#fd7e14" />
    </linearGradient>

    <!-- Gradiente rojo corporativo -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc3545" />
      <stop offset="100%" stop-color="#b02a37" />
    </linearGradient>
  </defs>

  <!-- Círculo base blanco con sombra y borde dorado sutil -->
  <circle cx="50" cy="50" r="46" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="3" filter="url(#shadow)" />

  <!-- Anillo interno decorativo rojo -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#dc3545" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />

  <!-- Gorro de Chef (Toque Blanche) estilizado -->
  <g id="chef-hat" transform="translate(0, -1)">
    <!-- Pliegues del gorro -->
    <path d="M35 38 C32 30, 42 22, 50 25 C58 22, 68 30, 65 38 C70 41, 68 49, 63 50 C63 52, 37 52, 37 50 C32 49, 30 41, 35 38 Z"
          fill="url(#redGrad)" />
    <!-- Banda del gorro -->
    <path d="M37 51 C37 50, 63 50, 63 51 L62 55 C62 56, 38 56, 38 55 Z" fill="#b02a37" />
    <!-- Detalle dorado en la banda del gorro -->
    <rect x="42" y="52" width="16" height="2" rx="1" fill="url(#goldGrad)" />
  </g>

  <!-- Cubiertos cruzados estilizados (Tenedor y Cuchara/Cuchillo) -->
  <g id="cutlery" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <!-- Tenedor izquierdo -->
    <path d="M33 55 L44 65" />
    <path d="M31 52 L35 56" />
    <path d="M30 55 L33 58" />
    
    <!-- Cuchara / Espátula derecha -->
    <path d="M67 55 L56 65" />
    <ellipse cx="66" cy="54" rx="2.5" ry="3.5" transform="rotate(-40 66 54)" fill="url(#goldGrad)" stroke="none" />
  </g>

  <!-- Campana / Plato Cloche base -->
  <path d="M32 66 Q50 64 68 66" stroke="#dc3545" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Texto DELB en la parte inferior -->
  <g transform="translate(50, 80)">
    <!-- Cinta / Fondo de texto -->
    <rect x="-24" y="-8.5" width="48" height="15" rx="7.5" fill="url(#redGrad)" />
    <text x="0" y="2.5"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="9"
          font-weight="900"
          letter-spacing="1.5"
          fill="#ffffff"
          text-anchor="middle">DELB</text>
  </g>

  <!-- Estrellas de calidad gastronómica -->
  <g fill="url(#goldGrad)" transform="translate(0, 0)">
    <!-- Estrella izquierda -->
    <polygon points="21,50 22.5,53 26,53.5 23.5,56 24,59.5 21,57.5 18,59.5 18.5,56 16,53.5 19.5,53" transform="scale(0.55) translate(14, 42)" />
    <!-- Estrella derecha -->
    <polygon points="21,50 22.5,53 26,53.5 23.5,56 24,59.5 21,57.5 18,59.5 18.5,56 16,53.5 19.5,53" transform="scale(0.55) translate(142, 42)" />
  </g>
</svg>
